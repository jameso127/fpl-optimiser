<text x="795.0" y="139.0" class="mono" font-size="13" font-weight="700" fill="#B8F34A" text-anchor="middle" >yes</text>
<rect class="a5" x="820" y="116" width="140" height="66" rx="14" fill="#122019" stroke="#B8F34A" stroke-width="2"/><text x="890.0" y="146.0" class="mono" font-size="18" font-weight="700" fill="#EAF2EC" text-anchor="middle" >notify</text><text x="890.0" y="167.0" class="sans" font-size="12" font-weight="400" fill="#9DB0A3" text-anchor="middle" >Telegram</text>
<path d="M962 149H994m-6-6l6 6-6 6" fill="none" stroke="#4A5E50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="a6"><rect x="998" y="122" width="160" height="54" rx="12" fill="#16201A" stroke="#B8F34A" stroke-opacity=".7"/><text x="1014.0" y="145.0" class="sans" font-size="14" font-weight="600" fill="#EAF2EC" text-anchor="start" >Gameweek plan</text><text x="1014.0" y="164.0" class="mono" font-size="12" font-weight="400" fill="#9DB0A3" text-anchor="start" >pitch + transfers</text></g>
<path d="M700 197V233" stroke="#4A5E50" stroke-width="2" stroke-dasharray="4 4"/>
<text x="710.0" y="221.0" class="mono" font-size="13" font-weight="700" fill="#9DB0A3" text-anchor="start" >no</text>
<text x="700.0" y="253.0" class="sans" font-size="13" font-weight="400" fill="#9DB0A3" text-anchor="middle" >data refreshed, nothing sent</text>
<text x="700.0" y="271.0" class="sans" font-size="12" font-weight="400" fill="#4A5E50" text-anchor="middle" >(a test run sends to testers anyway)</text>
<rect x="238" y="272" width="150" height="58" rx="14" fill="#122019" stroke="#2A3A30" stroke-dasharray="5 4" stroke-width="2"/>
<text x="313.0" y="298.0" class="mono" font-size="18" font-weight="700" fill="#EAF2EC" text-anchor="middle" >train</text>
<text x="313.0" y="317.0" class="sans" font-size="12" font-weight="400" fill="#9DB0A3" text-anchor="middle" >weekly, Tue 06:00</text>
