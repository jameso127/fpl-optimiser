<path class="a4" d="M630 149L700 103L770 149L700 195Z" fill="#122019" stroke="#FFB547" stroke-width="2"/>
<text x="700.0" y="145.0" class="mono" font-size="14" font-weight="700" fill="#EAF2EC" text-anchor="middle" >deadline</text>
<text x="700.0" y="163.0" class="mono" font-size="14" font-weight="700" fill="#EAF2EC" text-anchor="middle" >today?</text>
