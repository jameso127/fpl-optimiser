<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">The daily pipeline</title>
<desc id="d">Every morning at 10:00 UK, Cloud Scheduler starts a workflow: ingest the FPL API, predict expected points, optimise each user's plan, then if the deadline is today notify sends the plan on Telegram; otherwise nothing is sent. Training runs weekly and only promotes a model that passes a quality gate. Data and models are in Cloud Storage; users are in Firestore.</desc>
<style>.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@keyframes a1{0%,4.44%{stroke:#2A3A30}7.22%,15.56%{stroke:#B8F34A}19.44%,100%{stroke:#2A3A30}}.a1{animation:a1 9.0s cubic-bezier(.2,.8,.3,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes a2{0%,15.56%{stroke:#2A3A30}18.33%,26.67%{stroke:#B8F34A}30.56%,100%{stroke:#2A3A30}}.a2{animation:a2 9.0s cubic-bezier(.2,.8,.3,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes a3{0%,26.67%{stroke:#2A3A30}29.44%,37.78%{stroke:#B8F34A}41.67%,100%{stroke:#2A3A30}}.a3{animation:a3 9.0s cubic-bezier(.2,.8,.3,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes a4{0%,37.78%{stroke:#2A3A30}40.56%,48.89%{stroke:#FFB547}52.78%,100%{stroke:#2A3A30}}.a4{animation:a4 9.0s cubic-bezier(.2,.8,.3,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes a5{0%,48.89%{stroke:#2A3A30}51.67%,60.00%{stroke:#B8F34A}63.89%,100%{stroke:#2A3A30}}.a5{animation:a5 9.0s cubic-bezier(.2,.8,.3,1) infinite both;transform-box:fill-box;transform-origin:center}@keyframes a6{0%,55.56%{opacity:0;transform:translateY(8px)}60.00%,91.11%{opacity:1;transform:none}95.00%,100%{opacity:0;transform:translateY(8px)}}.a6{animation:a6 9.0s cubic-bezier(.2,.8,.3,1) infinite both;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16201A" stroke-width="1"/></pattern>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#D45BA0"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8E2F66" stroke-width="3"/></pattern>

</defs>
<rect width="1200" height="400" rx="24" fill="#0D1410"/>
<rect width="1200" height="400" rx="24" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="399" rx="24" fill="none" stroke="#2A3A30"/>
<text x="48.0" y="56.0" class="sans" font-size="22" font-weight="700" fill="#EAF2EC" text-anchor="start" >Every morning at 10:00 UK</text>
<text x="48.0" y="82.0" class="sans" font-size="15" font-weight="400" fill="#9DB0A3" text-anchor="start" >Cloud Scheduler starts a Cloud Workflow that runs four short-lived Cloud Run jobs</text>
<rect class="a1" x="48" y="116" width="150" height="66" rx="14" fill="#122019" stroke="#B8F34A" stroke-width="2"/><text x="123.0" y="146.0" class="mono" font-size="18" font-weight="700" fill="#EAF2EC" text-anchor="middle" >ingest</text><text x="123.0" y="167.0" class="sans" font-size="12" font-weight="400" fill="#9DB0A3" text-anchor="middle" >FPL API → Parquet</text>
<rect class="a2" x="238" y="116" width="150" height="66" rx="14" fill="#122019" stroke="#B8F34A" stroke-width="2"/><text x="313.0" y="146.0" class="mono" font-size="18" font-weight="700" fill="#EAF2EC" text-anchor="middle" >predict</text><text x="313.0" y="167.0" class="sans" font-size="12" font-weight="400" fill="#9DB0A3" text-anchor="middle" >xPts per player</text>
<rect class="a3" x="428" y="116" width="160" height="66" rx="14" fill="#122019" stroke="#B8F34A" stroke-width="2"/><text x="508.0" y="146.0" class="mono" font-size="18" font-weight="700" fill="#EAF2EC" text-anchor="middle" >optimise</text><text x="508.0" y="167.0" class="sans" font-size="12" font-weight="400" fill="#9DB0A3" text-anchor="middle" >best plan per user</text>
