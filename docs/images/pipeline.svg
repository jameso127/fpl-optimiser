<text x="323.0" y="252.0" class="sans" font-size="12" font-weight="400" fill="#9DB0A3" text-anchor="start" >new model, only if it</text>
<text x="323.0" y="267.0" class="sans" font-size="12" font-weight="400" fill="#9DB0A3" text-anchor="start" >passes the quality gate</text>
<rect x="48" y="352" width="540" height="30" rx="8" fill="#16201A"/><text x="60.0" y="372.0" class="mono" font-size="13" font-weight="400" fill="#B7C7BC" text-anchor="start" >Cloud Storage · Parquet data, predictions, models</text>
<rect x="600" y="352" width="360" height="30" rx="8" fill="#16201A"/><text x="612.0" y="372.0" class="mono" font-size="13" font-weight="400" fill="#B7C7BC" text-anchor="start" >Firestore · users, sent-once claims</text>
