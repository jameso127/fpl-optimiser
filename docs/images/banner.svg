<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">FPL Optimiser</title>
  <desc id="d">Animated banner: a 3-4-3 Fantasy Premier League formation with a captain, and an ingest, predict, optimise, notify pipeline with a gameweek plan notification.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .p{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.3,1.3) backwards}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
    .flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
    .sweep{animation:sweep 4.5s linear infinite}
    .fade{animation:fade .8s ease-out backwards}
    .chip{fill:#16201A;animation:chip 6s linear infinite backwards}
    .ct{fill:#B7C7BC;animation:ct 6s linear infinite backwards}
    .toast{animation:toast 6s ease-out infinite}
    @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
    @keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
    @keyframes flow{to{stroke-dashoffset:-28}}
    @keyframes sweep{from{transform:translateX(-80px)}to{transform:translateX(420px)}}
    @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes chip{0%{fill:#B8F34A}15%{fill:#B8F34A}25%,100%{fill:#16201A}}
    @keyframes ct{0%{fill:#0D1410}15%{fill:#0D1410}25%,100%{fill:#B7C7BC}}
    @keyframes toast{0%,72%{opacity:0;transform:translateY(10px)}78%,95%{opacity:1;transform:none}100%{opacity:0;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <clipPath id="pitch"><rect x="760" y="40" width="380" height="340" rx="20"/></clipPath>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#B8F34A" stop-opacity="0"/>
      <stop offset="1" stop-color="#B8F34A" stop-opacity=".22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16201A" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" rx="24" fill="#0D1410"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="24" fill="none" stroke="#2A3A30"/>

  <!-- text -->
  <g class="fade" style="animation-delay:.1s">
    <circle cx="68" cy="84" r="6" fill="#B8F34A"/>
    <circle class="ring" cx="68" cy="84" r="6" fill="none" stroke="#B8F34A" stroke-width="2"/>
    <text x="86" y="89" class="mono" font-size="14" letter-spacing="2.4" fill="#FFB547">FANTASY PREMIER LEAGUE</text>
  </g>
  <g class="fade" style="animation-delay:.25s">
    <text x="60" y="180" class="sans" font-size="82" font-weight="800" letter-spacing="-2.5" fill="#EAF2EC">FPL <tspan fill="#B8F34A">Optimiser</tspan></text>
  </g>
  <g class="fade" style="animation-delay:.45s">
    <text x="62" y="232" class="sans" font-size="24" fill="#B7C7BC">Find the highest-scoring squad within budget,</text>
    <text x="62" y="264" class="sans" font-size="24" fill="#B7C7BC">and get the plan on your phone every gameweek.</text>
  </g>

  <!-- pipeline -->
  <g class="fade" style="animation-delay:.7s">
    <rect class="chip" x="60" y="304" width="118" height="42" rx="21" style="animation-delay:0s"/>
    <text class="ct mono" x="119" y="330" font-size="15" font-weight="700" text-anchor="middle" style="animation-delay:0s">ingest</text>
    <path d="M186 325h14m-5-5l5 5-5 5" fill="none" stroke="#4A5E50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="chip" x="208" y="304" width="118" height="42" rx="21" style="animation-delay:1.5s"/>
    <text class="ct mono" x="267" y="330" font-size="15" font-weight="700" text-anchor="middle" style="animation-delay:1.5s">predict</text>
    <path d="M334 325h14m-5-5l5 5-5 5" fill="none" stroke="#4A5E50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="chip" x="356" y="304" width="130" height="42" rx="21" style="animation-delay:3s"/>
    <text class="ct mono" x="421" y="330" font-size="15" font-weight="700" text-anchor="middle" style="animation-delay:3s">optimise</text>
    <path d="M494 325h14m-5-5l5 5-5 5" fill="none" stroke="#4A5E50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect class="chip" x="516" y="304" width="130" height="42" rx="21" style="animation-delay:4.5s"/>
    <text class="ct mono" x="581" y="330" font-size="15" font-weight="700" text-anchor="middle" style="animation-delay:4.5s">notify</text>
  </g>

  <g class="toast">
    <rect x="60" y="362" width="440" height="42" rx="12" fill="#16201A" stroke="#B8F34A" stroke-opacity=".6"/>
    <path d="M82 392h16m-14-2v-6a6 6 0 0 1 12 0v6m-8 4a2 2 0 0 0 4 0" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="388" class="sans" font-size="15" font-weight="600" fill="#EAF2EC">Gameweek plan ready</text>
    <text x="270" y="388" class="mono" font-size="13" fill="#9DB0A3">· sent to Telegram</text>
  </g>

  <!-- pitch -->
  <g class="fade" style="animation-delay:.3s">
    <rect x="760" y="40" width="380" height="340" rx="20" fill="#122019" stroke="#2A3A30"/>
    <g clip-path="url(#pitch)">
      <g fill="none" stroke="#2F4A38" stroke-width="2">
        <rect x="776" y="56" width="348" height="308" rx="6"/>
        <line x1="950" y1="56" x2="950" y2="364"/>
        <circle cx="950" cy="210" r="46"/>
        <rect x="776" y="144" width="62" height="132"/>
        <rect x="776" y="178" width="24" height="64"/>
        <rect x="1062" y="144" width="62" height="132"/>
        <rect x="1100" y="178" width="24" height="64"/>
      </g>
      <rect class="sweep" x="760" y="40" width="80" height="340" fill="url(#beam)"/>
    </g>
  </g>

  <!-- passing lanes -->
  <g fill="none" stroke="#B8F34A" stroke-opacity=".45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path class="flow" d="M810 210H890L975 170L1060 210"/>
    <path class="flow" d="M890 130L975 100L1060 130" style="animation-delay:-.4s"/>
    <path class="flow" d="M890 290L975 320L1060 290" style="animation-delay:-.8s"/>
  </g>

  <!-- players: GK, 3 DEF, 4 MID, 3 FWD -->
  <g fill="#B8F34A" stroke="#0D1410" stroke-width="3">
    <circle class="p" cx="810" cy="210" r="14" style="animation-delay:.8s"/>

    <circle class="p" cx="890" cy="130" r="14" style="animation-delay:.9s"/>
    <circle class="p" cx="890" cy="210" r="14" style="animation-delay:1s"/>
    <circle class="p" cx="890" cy="290" r="14" style="animation-delay:1.1s"/>

    <circle class="p" cx="975" cy="100" r="14" style="animation-delay:1.2s"/>
    <circle class="p" cx="975" cy="170" r="14" style="animation-delay:1.3s"/>
    <circle class="p" cx="975" cy="250" r="14" style="animation-delay:1.4s"/>
    <circle class="p" cx="975" cy="320" r="14" style="animation-delay:1.5s"/>

    <circle class="p" cx="1060" cy="130" r="14" style="animation-delay:1.6s"/>
    <circle class="p" cx="1060" cy="290" r="14" style="animation-delay:1.8s"/>
  </g>

  <!-- captain -->
  <g>
    <circle class="ring" cx="1060" cy="210" r="17" fill="none" stroke="#FFB547" stroke-width="2.5" style="animation-delay:1.7s"/>
    <circle class="p" cx="1060" cy="210" r="17" fill="#FFB547" stroke="#0D1410" stroke-width="3" style="animation-delay:1.7s"/>
    <text class="sans fade" x="1060" y="216" font-size="17" font-weight="800" text-anchor="middle" fill="#0D1410" style="animation-delay:2.1s">C</text>
  </g>
</svg>
