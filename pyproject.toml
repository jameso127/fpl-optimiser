[project]
name = "fpl-backend"
version = "0.1.0"
description = "FPL optimiser backend: ingest, predict, optimise, notify, API"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "gcsfs>=2024.6",
]

[dependency-groups]
# Installed only into the predict image (`uv sync --no-dev --group predict`).
predict = ["lightgbm>=4.3"]
# The optimiser: SciPy's milp, which solves with HiGHS.
optimise = ["scipy>=1.11"]
dev = [
    {include-group = "predict"},
    {include-group = "optimise"},
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^\\.venv/", "^archive/"]
